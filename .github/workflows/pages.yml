# Publishes the jip: vocabulary (vocab/jip.ttl) with GitHub Pages, so that the namespace
# https://larsw.github.io/jip# resolves to a page describing its terms.
name: Vocabulary site

on:
  push:
    branches: [main]
    paths:
      - vocab/**
      - scripts/build-vocab-site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the site from vocab/jip.ttl
        run: |
          pip install --quiet rdflib==7.6.0
          python scripts/build-vocab-site.py build/vocab-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/vocab-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

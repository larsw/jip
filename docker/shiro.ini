# Fuseki security (Apache Shiro) for the demo: HTTP Basic authentication with two demo users.
# docker/entrypoint.sh passes this file with --shiro; point FUSEKI_SHIRO at another file (or
# mount one over /opt/fuseki/shiro.ini) for real use, with a proper realm instead of [users].
# The first matching [urls] rule wins.

[main]
ssl.enabled = false
plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher
localhostFilter=org.apache.jena.fuseki.authz.LocalhostFilter

[users]
# Demo accounts: user = password. The attest SERVICE records the user in each attestation.
alice = alice-demo-pw
bob   = bob-demo-pw

[urls]
/$/server  = anon
/$/ping    = anon
/$/metrics = anon
## The signing key and the data versions are public.
/$/provenance/key        = anon
/$/provenance/version/** = anon
## Attestations name the user who asked for them: authenticated users only.
/$/provenance/** = authcBasic
## The rest of the admin area: localhost only.
/$/** = localhostFilter
## The data and the attestation store: authenticated users.
/ds/**         = authcBasic
/provenance/** = authcBasic
/** = anon

# Fuseki security (Apache Shiro), installed into $FUSEKI_BASE on first start.
# Same as Fuseki's default, plus public read-only access to the provenance endpoints.
# The first matching [urls] rule wins.

[main]
ssl.enabled = false
plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher
localhostFilter=org.apache.jena.fuseki.authz.LocalhostFilter

[urls]
/$/server  = anon
/$/ping    = anon
/$/metrics = anon
## Attestations, signing key and data versions are public and read-only.
/$/provenance/** = anon
## The rest of the admin area: localhost only.
/$/** = localhostFilter
/**=anon
